# ABNK Dev Portal — 容器内 nginx 配置
#
# 拓扑口径（复刻 website :80 内容服务面，dev 子域第四次适用既有反代模式）：
# - 公网 TLS 终止在 abnk-nginx 入口容器（宿主 80/443 唯一绑定者），本容器经
#   compose 内网以平面 HTTP 被反代（dev.amazingbank.ai Host → abnk-devportal:80）
# - 不设 :443 块、不做 HTTP→HTTPS 301——入口 TLS 解封后再反代平面 HTTP 时，
#   容器内 301 会造成无限重定向环（website 0.1.2/0.1.3 前车之鉴）；本容器纯
#   静态直供，无需 compose 健康自检 TLS 面，故比 website 少一个 server 块
# - HSTS 由入口统一注入，HTTP 平面不重复声明（规范上 HSTS 仅经 TLS 响应生效）
#
# ABNK Dev Portal — in-container nginx configuration.
# Topology (mirrors the website :80 content plane, fourth reuse of the reverse
# proxy pattern): public TLS terminates at the abnk-nginx entry container, which
# proxies this container over plain HTTP on the compose network. No :443 block
# and no HTTP→HTTPS 301 — an in-container redirect would loop endlessly once the
# entry unwraps TLS and re-proxies plain HTTP (the website 0.1.2/0.1.3 lesson);
# this container is a pure static server with no TLS health-check plane needed.
# HSTS is injected by the entry, not repeated on the HTTP plane.

server {
    listen 80;
    listen [::]:80;
    server_name dev.amazingbank.ai _;

    # 安全响应头（与 website :80 面同源）
    # Security response headers (same set as the website :80 plane)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # gzip：文本类资源压缩（图片本就预压缩，正则不做无谓匹配）
    # gzip: text-ish resources only (images are pre-compressed anyway)
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    root  /usr/share/nginx/html;
    index index.html;
    # 反代后端（TLS 在入口终止）产出相对 Location 头——避免目录/规范重定向把
    # 协议降级为 http（实测坑：V4.2.3 公网走查发现 /evidence 目录 301 生成
    # http://… Location，浏览器二次跳转 http:80 再被入口 301 回 https）
    # Emit relative Location headers (TLS terminates at the entry): absolute
    # Location URLs would downgrade the scheme to http (the V4.2.3 finding —
    # the /evidence directory redirect produced http:// Locations)
    absolute_redirect off;

    # /assets/ 为 Vite 内容哈希产物——单头强缓存一年（同 website 发版策略）
    # /assets/ are Vite content-hashed outputs — immutable one-year caching
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # location 内含 add_header 时不再继承 server 级安全头——按序显式补齐
        # add_header inside a location stops inheriting server-level headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # /evidence/ 证据素材直供（sync 四桶复制、manifest 确定性清单）——文件名
    # 非内容哈希，发布链为手动重发：取一天公共缓存平衡新鲜度与回源，发版后
    # 至多一天自然对齐（回滚/对齐口径以镜像 tag 为准，见 4.4 发布手册）
    # /evidence/ direct-served assets (sync buckets + deterministic manifest) —
    # filenames are not content-hashed and releases are manual: one day of
    # public cache balances freshness vs origin load; alignment happens via
    # image tags (see the 4.4 release playbook)
    location /evidence/ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # 尾斜杠规范重定向：/evidence/（物理目录本身）→ /evidence（SPA 路由语义）
    # ——V4.2.3 修复的一部分：目录存在导致 location /evidence/ 的 =404 拦截
    # 尾斜杠深链；canonical 化到无斜杠形态后由下方 SPA fallback 接管
    # Trailing-slash canonical redirect: /evidence/ (the physical directory
    # itself) → /evidence (SPA route semantics) — part of the V4.2.3 fix:
    # the directory's existence made the /evidence/ location's =404 swallow
    # trailing-slash deep links; canonicalizing to the slash-less form hands
    # them to the SPA fallback below
    location = /evidence/ {
        return 301 /evidence;
    }

    # index.html no-store：发版后任何刷新方式回源拿新 HTML（根路径与 SPA
    # fallback 深链均经内部重定向命中本 location）
    # index.html no-store: every refresh hits origin for fresh HTML after a
    # release (root path and SPA fallback deep links land here via internal
    # redirect)
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 根级元文件随发版可能变更——no-cache 保留 304 协商校验
    # Root-level meta files may change per release — no-cache keeps 304 revalidation
    location = /favicon.svg {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA fallback：前端路由深链（/timeline/…、/docs/…、/metrics 等）回落
    # index.html——先于生产暴露路由层缺陷（V4.1.3 验证对象）。
    # ⚠️ 不用 $uri/ 目录形态（V4.2.3 实测坑）：public/evidence 物理目录会让
    # 裸 /evidence 深链触发目录 301 → /evidence/ → 资产 location 的 =404，
    # SPA 回退被目录拦截；文件命中走 $uri（唯一需要目录索引的场景不存在）
    # SPA fallback: front-end route deep links fall back to index.html —
    # surfaces routing-layer defects before production (the V4.1.3 check).
    # ⚠️ No $uri/ directory form (the V4.2.3 pitfall): the physical
    # public/evidence directory made the bare /evidence deep link trigger a
    # directory 301 → /evidence/ → the asset location's =404, so the SPA
    # fallback was shadowed by the directory; file hits go through $uri (no
    # directory-index use case exists)
    location / {
        try_files $uri /index.html;
    }
}
